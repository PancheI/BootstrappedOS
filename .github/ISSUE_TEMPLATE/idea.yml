name: Idea or missing role
description: Something the OS should do, or a tool it should support
labels: [idea]
body:
  - type: textarea
    id: job
    attributes: { label: What job do you want done?, description: "The task in your business, not the feature. For example: 'answer refund emails in my voice'." }
    validations: { required: true }
  - type: textarea
    id: today
    attributes: { label: How do you do it today? }
